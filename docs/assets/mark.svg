<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     role="img"
     aria-label="BacSelect mark">

  <!-- Background -->
  <rect width="64" height="64" rx="18" fill="#141717"/>

  <!-- Unselected bacterium: upper-left rod -->
  <g transform="translate(17.5 15.5) rotate(-42)"
     fill="none"
     stroke="#f4f1ea"
     stroke-linecap="round"
     stroke-linejoin="round"
     opacity=".38">

    <rect x="-3"
          y="-5.2"
          width="6"
          height="10.4"
          rx="3"
          stroke-width=".8"/>

    <path d="M-1.45-.25
             C-1.2-1.7 .25-2.15 1.35-1.2
             C2.15-.45 1.75 1.2 .55 1.55
             C-.7 1.9-1.75 1-1.45-.25Z"
          stroke-width=".6"/>
  </g>

  <!-- Unselected bacterium: lower-left coccus -->
  <g transform="translate(20.5 50.5)"
     fill="none"
     stroke="#f4f1ea"
     stroke-linecap="round"
     stroke-linejoin="round"
     opacity=".38">

    <circle r="3.2"
            stroke-width=".8"/>

    <path d="M-1.4-.15
             C-1.2-1.55 .2-2 1.3-1.1
             C2-.35 1.6 1.15 .5 1.45
             C-.7 1.8-1.65.95-1.4-.15Z"
          stroke-width=".6"/>
  </g>

  <!-- Selection brackets -->
  <g fill="none"
     stroke="#a875ff"
     stroke-width=".9"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Upper-right -->
    <path d="M34 10v-2h2
             M48 8h2v2
             M50 22v2h-2
             M36 24h-2v-2"/>

    <!-- Middle-left -->
    <path d="M9 28v-2h2
             M22 26h2v2
             M24 39v2h-2
             M11 41H9v-2"/>

    <!-- Lower-right -->
    <path d="M34 42v-2h2
             M48 40h2v2
             M50 53v2h-2
             M36 55h-2v-2"/>
  </g>

  <!-- Selected bacterium: upper-right diagonal bacillus -->
  <g transform="translate(42 16) rotate(-42)"
     stroke-linecap="round"
     stroke-linejoin="round">

    <rect x="-3.8"
          y="-7.1"
          width="7.6"
          height="14.2"
          rx="3.8"
          fill="#5b5cf0"
          stroke="#a875ff"
          stroke-width=".8"/>

    <path d="M-1.7-.25
             C-1.45-1.9 .25-2.4 1.55-1.35
             C2.5-.5 2.05 1.4 .65 1.8
             C-.8 2.2-2.05 1.15-1.7-.25Z"
          fill="none"
          stroke="#f2ddff"
          stroke-width=".6"/>
  </g>

  <!-- Selected bacterium: middle-left coccus -->
  <g transform="translate(17.5 33.5)"
     stroke-linecap="round"
     stroke-linejoin="round">

    <circle r="4.6"
            fill="#5b5cf0"
            stroke="#a875ff"
            stroke-width=".8"/>

    <path d="M-1.7-.2
             C-1.45-1.85 .2-2.35 1.5-1.3
             C2.4-.45 2 1.35 .6 1.75
             C-.8 2.15-2.05 1.1-1.7-.2Z"
          fill="none"
          stroke="#f2ddff"
          stroke-width=".6"/>
  </g>

  <!-- Selected bacterium: lower-right horizontal bacillus -->
  <g transform="translate(42 48) rotate(-4)"
     stroke-linecap="round"
     stroke-linejoin="round">

    <rect x="-6.35"
          y="-3.5"
          width="12.7"
          height="7"
          rx="3.5"
          fill="#5b5cf0"
          stroke="#a875ff"
          stroke-width=".8"/>

    <path d="M-1.65-.2
             C-1.4-1.8 .25-2.3 1.5-1.25
             C2.4-.45 2 1.3 .6 1.7
             C-.8 2.1-2 1.05-1.65-.2Z"
          fill="none"
          stroke="#f2ddff"
          stroke-width=".6"/>
  </g>

</svg>
