[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bacselect"
version = "0.0.0"
description = "Deterministic selection of structurally diverse bacterial genome panels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]
authors = [
    { name = "Rhys White" }
]

[project.optional-dependencies]
test = [
    "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
