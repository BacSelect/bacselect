site_name: BacSelect
site_description: Bacterial genome diversity, at the scale you need.

theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/mark.svg
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Start here:
      - Getting started: getting-started.md
      - Choosing N: choosing-n.md
  - Core concepts:
      - Overview: concepts/index.md
      - Source universe: concepts/source-universe.md
      - Genome architecture: concepts/genome-architecture.md
      - Species balancing: concepts/species-balancing.md
      - Structural distance: concepts/distance-and-coverage.md
      - Nested panels: concepts/nested-panels.md
  - How BacSelect works:
      - Overview: methods/overview.md
      - Mathematics: methods/mathematics.md
      - Scientific specification: scientific-specification.md
  - Validation: validation/index.md
  - Releases:
      - Overview: releases/index.md
      - Reproducibility: releases/reproducibility.md
  - Decisions:
      - Overview: decisions/index.md
      - GenBank GCA identity: decisions/0001-genbank-gca-identity.md
      - Structural selection: decisions/0002-structural-selection.md
      - Species-balanced geometry: decisions/0003-species-balanced-geometry.md
      - Nested panels: decisions/0004-nested-panels.md
      - Immutable releases: decisions/0005-immutable-releases.md
      - Fail-closed releases: decisions/0006-fail-closed-releases.md
  - Reference:
      - Glossary: reference/glossary.md
      - FAQ: reference/faq.md
      - Further reading: reference/further-reading.md
      - Citation: reference/citation.md
  - Development:
      - Setup: development/setup.md
      - Testing: development/testing.md
      - Code architecture: development/architecture.md
