name: BacSelect monthly production

on:
  schedule:
    - cron: '17 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bacselect-monthly-production
  cancel-in-progress: false

jobs:
  portability-preflight:
    name: Portable production preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout BacSelect
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          check-latest: false

      - name: Install BacSelect and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run BacSelect test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Verify production portability contract
        shell: bash
        run: |
          set -euo pipefail
          python validation/selector-v1/check_production_portability.py

      - name: Reconstruct frozen NCBI Datasets environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          micromamba-version: '2.8.1-0'
          environment-file: environments/ncbi-datasets-linux-64.reconstruction.explicit.txt
          environment-name: bacselect-ncbi-datasets-runtime
          init-shell: none
          generate-run-shell: false
          cache-environment: false
          cache-downloads: false
          post-cleanup: all

      - name: Verify reconstructed NCBI Datasets environment
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ENV_FILE="environments/ncbi-datasets-linux-64.explicit.txt"
          EXPECTED_SOURCE_ENV_SHA="6d965c7c4f7db0464e4fba2434f85f1b7da3f7136790babca444888b6e6096cd"

          RECON_ENV_FILE="environments/ncbi-datasets-linux-64.reconstruction.explicit.txt"
          EXPECTED_RECON_ENV_SHA="5e3b5008cf773689459acfe1ecfe0ce45bf89374f1dc3ebedd5cc3ff0f59c0e1"

          OBSERVED_SOURCE_ENV_SHA="$(
            sha256sum "$SOURCE_ENV_FILE" |
            awk '{print $1}'
          )"

          if [[ "$OBSERVED_SOURCE_ENV_SHA" != "$EXPECTED_SOURCE_ENV_SHA" ]]; then
            echo "FAIL | frozen scientific NCBI environment SHA256 mismatch"
            exit 1
          fi

          echo "PASS | frozen scientific NCBI environment SHA256 verified"

          OBSERVED_RECON_ENV_SHA="$(
            sha256sum "$RECON_ENV_FILE" |
            awk '{print $1}'
          )"

          if [[ "$OBSERVED_RECON_ENV_SHA" != "$EXPECTED_RECON_ENV_SHA" ]]; then
            echo "FAIL | NCBI reconstruction manifest SHA256 mismatch"
            exit 1
          fi

          echo "PASS | checksum-authenticated reconstruction manifest SHA256 verified"

          micromamba --version

          VERSION_OUTPUT="$(
            micromamba run \
              -n bacselect-ncbi-datasets-runtime \
              datasets --version
          )"

          printf '%s\n' "$VERSION_OUTPUT"

          if [[ "$VERSION_OUTPUT" != "datasets version: 18.35.0" ]]; then
            echo "FAIL | reconstructed NCBI Datasets version mismatch"
            exit 1
          fi

          echo "PASS | reconstructed NCBI Datasets version is exactly 18.35.0"

          echo
          echo "===== reconstructed explicit package identity ====="
          micromamba env export \
            -n bacselect-ncbi-datasets-runtime \
            --explicit

          echo
          echo "PASS | frozen NCBI environment reconstructed without source acquisition"

      - name: Verify frozen monthly release primitives
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from bacselect.monthly_release_start import derive_release_id

          observed = derive_release_id(
              "2026-09-01T00:17:00Z"
          )

          if observed != "2026.09":
              raise SystemExit(
                  f"unexpected release identity: {observed}"
              )

          print(
              "PASS | frozen monthly day-01 release identity "
              "derivation is available"
          )
          PY

      - name: Enforce UTC day 01 for scheduled execution
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail

          DAY="$(date -u +%d)"

          if [[ "$DAY" != "01" ]]; then
              echo "FAIL | scheduled production event is not UTC day 01"
              exit 1
          fi

          echo "PASS | scheduled event is running on UTC day 01"

      - name: Confirm preflight-only production state
        shell: bash
        run: |
          set -euo pipefail

          echo "PASS | portable monthly scheduler is active"
          echo "PASS | source acquisition is not enabled by this workflow"
          echo "PASS | release publication is not enabled by this workflow"
